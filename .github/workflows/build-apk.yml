name: Build MechOS APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
concurrency:
  group: mechos-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download OpenStax offline textbook
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 https://openlibrary-repo.ecampusontario.ca/jspui/bitstream/123456789/432/1/university-physics-volume-1-5.2.pdf -o app/src/main/assets/UniversityPhysicsVolume1.pdf
          test $(stat -c%s app/src/main/assets/UniversityPhysicsVolume1.pdf) -gt 50000000
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MechOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
